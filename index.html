<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FANUC 0i-MF Plus Mobile CNC</title>
    <style>
        :root {
            --bg-color: #121316;
            --panel-bg: #22252b;
            --panel-border: #141518;
            --lcd-bg: #000c18;
            --lcd-green: #00ff66;
            --lcd-yellow: #ffff00;
            --lcd-cyan: #00e5ff;
            --btn-dark: #32363e;
            --btn-blue: #224466;
            --btn-orange: #b35900;
            --btn-green: #1b5e20;
            --btn-red: #b71c1c;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
        }

        /* 手機直立式主容器 */
        .cnc-mobile-app {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.9);
        }

        /* --- 1. LCD 螢幕區 (含動態 Softkey 列) --- */
        .lcd-display {
            background-color: var(--lcd-bg);
            border: 2px solid #333;
            border-radius: 4px;
            height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            position: relative;
        }

        .lcd-header {
            display: flex;
            justify-content: space-between;
            color: var(--lcd-yellow);
            font-size: 11px;
            font-weight: bold;
            border-bottom: 1px dashed #224433;
            padding-bottom: 3px;
        }

        .lcd-content {
            flex: 1;
            padding: 6px 0;
            overflow-y: auto;
            font-size: 13px;
        }

        /* 座標顯示格 */
        .pos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .pos-title { color: #888; font-size: 11px; border-bottom: 1px solid #222; margin-bottom: 2px; }
        .pos-row { display: flex; justify-content: space-between; margin: 2px 0; font-weight: bold; }
        .pos-axis { color: var(--lcd-cyan); }
        .pos-val { color: var(--lcd-green); }

        /* MDI 輸入緩衝列 */
        .lcd-buffer {
            height: 20px;
            background: #00182b;
            color: var(--lcd-yellow);
            font-size: 12px;
            display: flex;
            align-items: center;
            padding: 0 4px;
            border-top: 1px solid #113344;
        }

        /* LCD 底部動態選單列 (12 Slots) */
        .lcd-softkey-bar {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1px;
            background: #111;
            border-top: 1px solid #444;
            height: 22px;
        }

        .lcd-sk-label {
            background: #0d2233;
            color: #fff;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-right: 1px solid #000;
            overflow: hidden;
            white-space: nowrap;
        }

        /* --- 2. 面板下 12 顆實體小黑鍵 (純黑色 無印刷) --- */
        .physical-softkeys {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 3px;
        }

        .sk-black-btn {
            height: 32px;
            background: #1a1c20;
            border: 1px solid #444;
            border-bottom: 2px solid #000;
            border-radius: 3px;
            cursor: pointer;
        }

        .sk-black-btn:active {
            background: #444;
            transform: translateY(1px);
        }

        /* --- 3. MDI 實體功能與鍵盤區 --- */
        .mdi-section {
            background: #1a1c20;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .mdi-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .btn-mdi {
            height: 36px;
            background: var(--btn-dark);
            border: 1px solid #444;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-mdi:active { opacity: 0.7; }
        .btn-sys { background: var(--btn-blue); color: #80d4ff; }
        .btn-edit { background: #4a3525; color: #ffb84d; }
        .btn-exec { background: var(--btn-green); }

        /* --- 4. 機台操作面板 (MODE 轉鈕、JOG、Cycle) --- */
        .mop-section {
            background: #1a1c20;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mop-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* MODE 旋轉鈕 */
        .knob-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .knob-dial {
            width: 48px;
            height: 48px;
            background: #444;
            border: 3px solid #777;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .knob-pointer {
            position: absolute;
            top: 4px;
            left: 21px;
            width: 4px;
            height: 18px;
            background: #ff3333;
            border-radius: 2px;
        }

        /* JOG 按鈕區 */
        .jog-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .btn-jog {
            height: 38px;
            background: #2a2d34;
            border: 1px solid #555;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-jog:active { background: #0288d1; }
        .btn-estop { background: var(--btn-red); border: 2px solid #ffeb3b; font-size: 10px; }
        .btn-start { background: var(--btn-green); color: #fff; font-size: 10px; }

        textarea.code-editor {
            width: 100%;
            height: 160px;
            background: transparent;
            color: var(--lcd-green);
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 12px;
            resize: none;
        }
    </style>
</head>
<body>

<div class="cnc-mobile-app">
    <!-- 1. LCD 螢幕顯示區 -->
    <div class="lcd-display">
        <div class="lcd-header">
            <span>FANUC 0i-MF Plus</span>
            <span id="lcd-mode-status">MEM &nbsp; **** &nbsp; STMT</span>
            <span id="lcd-prog-id">O0001 N00000</span>
        </div>

        <div class="lcd-content" id="lcd-main-viewport">
            <!-- 動態由 JavaScript 繪製內容 (POS, PROG, OFFSET 等) -->
        </div>

        <!-- MDI 輸入快取列 -->
        <div class="lcd-buffer">
            <span>&gt;&nbsp;</span><span id="buf-text"></span>
        </div>

        <!-- LCD 畫面底部：12 個動態 Softkey 標籤格 -->
        <div class="lcd-softkey-bar" id="softkey-bar">
            <!-- 由 JS 動態生成文字 -->
        </div>
    </div>

    <!-- 2. 面板正下方 12 顆實體小黑鍵 (無文字) -->
    <div class="physical-softkeys">
        <button class="sk-black-btn" onclick="pressSoftkey(0)"></button>
        <button class="sk-black-btn" onclick="pressSoftkey(1)"></button>
        <button class="sk-black-btn" onclick="pressSoftkey(2)"></button>
        <button class="sk-black-btn" onclick="pressSoftkey(3)"></button>
        <button class="sk-black-btn" onclick="pressSoftkey(4)"></button>
        <button class="sk-black-btn" onclick="pressSoftkey(5)"></button>
        <button class="sk-black-btn" onclick="pressSoftkey(6)"></button>
        <button class="sk-black-btn" onclick="pressSoftkey(7)"></button>
        <button class="sk-black-btn" onclick="pressSoftkey(8)"></button>
        <button class="sk-black-btn" onclick="pressSoftkey(9)"></button>
        <button class="sk-black-btn" onclick="pressSoftkey(10)"></button>
        <button class="sk-black-btn" onclick="pressSoftkey(11)"></button>
    </div>

    <!-- 3. MDI 實體按鍵區 -->
    <div class="mdi-section">
        <div class="mdi-row">
            <button class="btn-mdi btn-sys" onclick="switchMainPage('POS')">POS</button>
            <button class="btn-mdi btn-sys" onclick="switchMainPage('PROG')">PROG</button>
            <button class="btn-mdi btn-sys" onclick="switchMainPage('OFFSET')">OFS/SET</button>
            <button class="btn-mdi btn-sys" onclick="switchMainPage('SYSTEM')">SYSTEM</button>
            <button class="btn-mdi btn-sys" onclick="switchMainPage('MSG')">MSG</button>
        </div>
        <div class="mdi-row">
            <button class="btn-mdi" onclick="pressKey('O')">O</button>
            <button class="btn-mdi" onclick="pressKey('N')">N</button>
            <button class="btn-mdi" onclick="pressKey('G')">G</button>
            <button class="btn-mdi" onclick="pressKey('7')">7</button>
            <button class="btn-mdi" onclick="pressKey('8')">8</button>
        </div>
        <div class="mdi-row">
            <button class="btn-mdi" onclick="pressKey('X')">X</button>
            <button class="btn-mdi" onclick="pressKey('Y')">Y</button>
            <button class="btn-mdi" onclick="pressKey('Z')">Z</button>
            <button class="btn-mdi" onclick="pressKey('4')">4</button>
            <button class="btn-mdi" onclick="pressKey('5')">5</button>
        </div>
        <div class="mdi-row">
            <button class="btn-mdi" onclick="pressKey('M')">M</button>
            <button class="btn-mdi" onclick="pressKey('S')">S</button>
            <button class="btn-mdi" onclick="pressKey('T')">T</button>
            <button class="btn-mdi" onclick="pressKey('1')">1</button>
            <button class="btn-mdi" onclick="pressKey('2')">2</button>
        </div>
        <div class="mdi-row">
            <button class="btn-mdi" onclick="pressKey('F')">F</button>
            <button class="btn-mdi" onclick="pressKey('H')">H</button>
            <button class="btn-mdi" onclick="pressKey('D')">D</button>
            <button class="btn-mdi" onclick="pressKey('0')">0</button>
            <button class="btn-mdi" onclick="pressKey('.')">.</button>
        </div>
        <div class="mdi-row">
            <button class="btn-mdi btn-edit" onclick="pressKey('CAN')">CAN</button>
            <button class="btn-mdi btn-edit" onclick="pressKey('EOB')">EOB</button>
            <button class="btn-mdi btn-edit" onclick="pressKey('ALTER')">ALTER</button>
            <button class="btn-mdi btn-edit" onclick="pressKey('INSERT')">INSERT</button>
            <button class="btn-mdi btn-exec" onclick="pressInput()">INPUT</button>
        </div>
    </div>

    <!-- 4. 機台操作面板 (Mode 轉鈕與 JOG 搬移) -->
    <div class="mop-section">
        <div class="mop-top">
            <div class="knob-container">
                <div class="knob-dial" id="knob-mode" onclick="rotateModeKnob()">
                    <div class="knob-pointer"></div>
                </div>
                <div>
                    <div style="font-size:10px; color:#aaa;">MODE 模式</div>
                    <div style="font-size:12px; color:var(--lcd-yellow); font-weight:bold;" id="knob-mode-text">MEM</div>
                </div>
            </div>
            <div style="display:flex; gap:6px;">
                <button class="btn-jog btn-start" onclick="handleCycleStart()">CYCLE<br>START</button>
                <button class="btn-jog btn-estop" onclick="handleEStop()">E-STOP<br>緊急停止</button>
            </div>
        </div>

        <div class="jog-grid">
            <button class="btn-jog" onclick="jogMove('X', 1)">+X</button>
            <button class="btn-jog" onclick="jogMove('Y', 1)">+Y</button>
            <button class="btn-jog" onclick="jogMove('Z', 1)">+Z</button>
            <button class="btn-jog" style="background:#e65100" onclick="triggerRefZero()">原點復歸</button>
            <button class="btn-jog" onclick="jogMove('X', -1)">-X</button>
            <button class="btn-jog" onclick="jogMove('Y', -1)">-Y</button>
            <button class="jog-btn btn-jog" onclick="jogMove('Z', -1)">-Z</button>
            <button class="btn-jog" id="btn-rapid" onclick="toggleRapid()">快速寸動</button>
        </div>
    </div>
</div>

<script>
    // --- 控制器核心數據結構 ---
    const modes = ['MEM', 'EDIT', 'MDI', 'JOG', 'REF'];
    let currentModeIdx = 0;
    
    let state = {
        mainPage: 'POS',  // POS, PROG, OFFSET, SYSTEM
        subPage: 'ALL',   // POS: ABS, REL, ALL; OFFSET: TOOL, WORK
        isOprt: false,    // 是否在 (OPRT) 選單層
        buffer: '',
        isRapid: false
    };

    let posData = {
        rel: { x: 0.000, y: 0.000, z: 0.000 },
        abs: { x: -120.412, y: 235.198, z: -130.760 },
        mach: { x: 200.410, y: 0.750, z: -130.760 }
    };

    let offsets = { H01: -150.250, D01: 10.000 };
    let programCode = "O0001;\nG90 G54 G00 X0 Y0;\nM03 S1500;\nG43 H01 Z50.;\nM30;";

    // --- 根據 FANUC 0i-MF 規範動態計算 12 顆 Softkey 標籤 ---
    function getSoftkeyMenu() {
        let labels = Array(12).fill("");

        if (state.mainPage === 'POS') {
            if (!state.isOprt) {
                labels[0] = "ABS";
                labels[1] = "REL";
                labels[2] = "ALL";
                labels[11] = "(OPRT)";
            } else {
                labels[0] = "PRESET"; // 相對座標清零
                labels[1] = "EXEC";
                labels[11] = "RETURN";
            }
        } 
        else if (state.mainPage === 'PROG') {
            if (!state.isOprt) {
                labels[0] = "PRGRM";
                labels[1] = "DIR";
                labels[2] = "SEARCH";
                labels[11] = "(OPRT)";
            } else {
                labels[0] = "CREATE"; // 新作檔案
                labels[1] = "READ";   // 讀取
                labels[2] = "DELETE";
                labels[11] = "RETURN";
            }
        } 
        else if (state.mainPage === 'OFFSET') {
            if (!state.isOprt) {
                labels[0] = "OFFSET"; // 刀長/半徑
                labels[1] = "SETTING";
                labels[2] = "WORK";   // 工件座標系
                labels[11] = "(OPRT)";
            } else {
                labels[0] = "INPUT";  // 覆寫補正值
                labels[1] = "+INPUT"; // 累加補正值
                labels[11] = "RETURN";
            }
        }
        return labels;
    }

    // 渲染 LCD 螢幕底部 12 Slots Softkey 標籤列
    function renderSoftkeys() {
        const bar = document.getElementById('softkey-bar');
        bar.innerHTML = "";
        const labels = getSoftkeyMenu();
        
        labels.forEach(lbl => {
            const div = document.createElement('div');
            div.className = 'lcd-sk-label';
            div.innerText = lbl;
            bar.appendChild(div);
        });
    }

    // 渲染 LCD 主畫面 Viewport
    function renderViewport() {
        const vp = document.getElementById('lcd-main-viewport');
        vp.innerHTML = "";

        if (state.mainPage === 'POS') {
            vp.innerHTML = `
                <div class="pos-grid">
                    <div>
                        <div class="pos-title">[相對座標 RELATIVE]</div>
                        <div class="pos-row"><span class="pos-axis">X</span><span class="pos-val">${posData.rel.x.toFixed(3)}</span></div>
                        <div class="pos-row"><span class="pos-axis">Y</span><span class="pos-val">${posData.rel.y.toFixed(3)}</span></div>
                        <div class="pos-row"><span class="pos-axis">Z</span><span class="pos-val">${posData.rel.z.toFixed(3)}</span></div>

                        <div class="pos-title" style="margin-top:10px;">[絕對座標 ABSOLUTE]</div>
                        <div class="pos-row"><span class="pos-axis">X</span><span class="pos-val">${posData.abs.x.toFixed(3)}</span></div>
                        <div class="pos-row"><span class="pos-axis">Y</span><span class="pos-val">${posData.abs.y.toFixed(3)}</span></div>
                        <div class="pos-row"><span class="pos-axis">Z</span><span class="pos-val">${posData.abs.z.toFixed(3)}</span></div>
                    </div>
                    <div>
                        <div class="pos-title">[機械座標 MACHINE]</div>
                        <div class="pos-row"><span class="pos-axis">X</span><span class="pos-val">${posData.mach.x.toFixed(3)}</span></div>
                        <div class="pos-row"><span class="pos-axis">Y</span><span class="pos-val">${posData.mach.y.toFixed(3)}</span></div>
                        <div class="pos-row"><span class="pos-axis">Z</span><span class="pos-val">${posData.mach.z.toFixed(3)}</span></div>
                    </div>
                </div>
            `;
        } 
        else if (state.mainPage === 'PROG') {
            vp.innerHTML = `
                <div style="color:var(--lcd-yellow); font-size:11px;">PROGRAM EDITOR (${modes[currentModeIdx]})</div>
                <textarea class="code-editor" id="txt-prog" spellcheck="false" ${modes[currentModeIdx] !== 'EDIT' ? 'readonly' : ''}>${programCode}</textarea>
            `;
        } 
        else if (state.mainPage === 'OFFSET') {
            vp.innerHTML = `
                <div style="color:var(--lcd-yellow); font-size:11px; margin-bottom:6px;">OFFSET / GEOMETRY (刀具補正)</div>
                <table style="width:100%; font-size:12px; color:#fff; text-align:left;">
                    <tr style="color:var(--lcd-cyan); border-bottom:1px solid #333;">
                        <th>NO.</th><th>GEOM (H) 刀長</th><th>GEOM (D) 半徑</th>
                    </tr>
                    <tr>
                        <td>01</td>
                        <td>${offsets.H01.toFixed(3)}</td>
                        <td>${offsets.D01.toFixed(3)}</td>
                    </tr>
                </table>
            `;
        }
    }

    // --- 實體按鍵與觸控邏輯 ---

    // 點擊面板下 12 顆小黑鍵
    function pressSoftkey(index) {
        const labels = getSoftkeyMenu();
        const clickedLabel = labels[index];

        if (!clickedLabel) return;

        if (clickedLabel === "(OPRT)") {
            state.isOprt = true;
        } else if (clickedLabel === "RETURN") {
            state.isOprt = false;
        } 
        // POS 操作：相對座標預設歸零
        else if (clickedLabel === "PRESET") {
            posData.rel = { x: 0.000, y: 0.000, z: 0.000 };
            alert("相對座標已成功歸零 (PRESET)");
        } 
        // PROG 操作：新建檔案
        else if (clickedLabel === "CREATE") {
            if (modes[currentModeIdx] !== 'EDIT') {
                alert("新建或修改檔案請先將 MODE 切換至 EDIT 模式！");
                return;
            }
            programCode = "O" + Math.floor(1000 + Math.random() * 9000) + ";\nM30;";
            alert("已新建空白 NC 程式");
        }

        renderSoftkeys();
        renderViewport();
    }

    // MDI 主選單功能切換鍵
    function switchMainPage(page) {
        state.mainPage = page;
        state.isOprt = false;
        renderSoftkeys();
        renderViewport();
    }

    // MODE 旋轉鈕切換
    function rotateModeKnob() {
        currentModeIdx = (currentModeIdx + 1) % modes.length;
        const curMode = modes[currentModeIdx];
        const angles = [0, 45, 90, 135, 180];

        document.getElementById('knob-mode').style.transform = `rotate(${angles[currentModeIdx]}deg)`;
        document.getElementById('knob-mode-text').innerText = curMode;
        document.getElementById('lcd-mode-status').innerText = `${curMode} \u00A0 **** \u00A0 STMT`;
        
        renderViewport();
    }

    // JOG 寸動移動
    function jogMove(axis, dir) {
        const curMode = modes[currentModeIdx];
        if (curMode !== 'JOG' && curMode !== 'REF') {
            alert("請先將 MODE 旋鈕轉至 JOG 或 REF 模式！");
            return;
        }

        let step = state.isRapid ? 10.0 : 1.0;
        let a = axis.toLowerCase();

        posData.rel[a] += step * dir;
        posData.abs[a] += step * dir;
        posData.mach[a] += step * dir;

        renderViewport();
    }

    // 原點歸零 (G28)
    function triggerRefZero() {
        if (modes[currentModeIdx] !== 'REF') {
            alert("原點復歸請先切換 MODE 至 REF 模式！");
            return;
        }
        posData.mach = { x: 0.000, y: 0.000, z: 0.000 };
        renderViewport();
        alert("全軸已安全返回機械原點 (REF ZERO RETURN)");
    }

    function toggleRapid() {
        state.isRapid = !state.isRapid;
        document.getElementById('btn-rapid').style.background = state.isRapid ? '#ff6d00' : '#2a2d34';
    }

    // MDI 按鍵點擊
    function pressKey(char) {
        if (char === 'CAN') {
            state.buffer = state.buffer.slice(0, -1);
        } else if (char === 'EOB') {
            state.buffer += ";";
        } else {
            state.buffer += char;
        }
        document.getElementById('buf-text').innerText = state.buffer;
    }

    // MDI INPUT 按鈕執行
    function pressInput() {
        if (!state.buffer) return;

        if (state.mainPage === 'OFFSET') {
            let val = parseFloat(state.buffer);
            if (!isNaN(val)) {
                if (state.buffer.includes('H')) offsets.H01 = val;
                else offsets.D01 = val;
            }
        }
        state.buffer = "";
        document.getElementById('buf-text').innerText = "";
        renderViewport();
    }

    function handleCycleStart() {
        if (modes[currentModeIdx] !== 'MEM') {
            alert("自動執行請先切換至 MEM 模式");
            return;
        }
        alert("CYCLE START: 程式開始執行");
    }

    function handleEStop() {
        alert("EMERGENCY STOP: 緊急停止已觸發");
    }

    // 初始化
    renderSoftkeys();
    renderViewport();
</script>

</body>
</html>
